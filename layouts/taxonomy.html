{{ define "main" }}
<header class="narrow center" style="padding-top: 3rem">
  <h1>{{ i18n .Data.Plural | default .Title }}</h1>
  <hr class="rule">
</header>
<ul class="list-plain center">
  {{ range .Data.Terms.Alphabetical }}
  <li style="justify-content: center"><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a> <span class="muted small">{{ .Count }}</span></li>
  {{ end }}
</ul>
{{ end }}

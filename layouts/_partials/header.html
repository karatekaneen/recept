<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="{{ i18n "mainMenu" }}">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <div class="header-tools">
      <div class="search-box" id="sok" role="search" aria-label="{{ i18n "search" }}"></div>
      <div class="lang">
        {{ with .Translations }}
          {{ range . }}<a class="lang-switch" href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" title="{{ i18n "thisPageIn" }}">{{ .Language.Lang }}</a>{{ end }}
        {{ else }}
          {{ range site.Home.Translations }}<a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Lang }}</a>{{ end }}
        {{ end }}
      </div>
    </div>
  </div>
</header>
